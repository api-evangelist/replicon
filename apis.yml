name: Replicon
description: >-
  Replicon, now a Deltek company, is a time-tracking, project time and expense,
  and professional-services automation (PSA) platform. Its Time Intelligence
  Platform and the Polaris PSA product manage timesheets, projects, tasks,
  clients, resources, billing and costing for professional-services and
  enterprise teams. Replicon exposes a proprietary JSON-over-HTTPS web-service
  API (no public OpenAPI) covering users, clients, projects, tasks, time,
  billing and analytics; callers resolve a tenant swimlane through a global
  discovery service and authenticate with an Api-token header or HTTP Basic.
